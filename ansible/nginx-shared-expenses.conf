map $http_upgrade $shared_expenses_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 4004 ssl;
    listen [::]:4004 ssl;
    server_name erdmko.dev;

    ssl_certificate /etc/letsencrypt/live/erdmko.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erdmko.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $shared_expenses_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
